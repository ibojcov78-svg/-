<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }

      /* Flash cut overlay — instant access for hard cuts between scenes */
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        z-index: 200;
        pointer-events: none;
        visibility: hidden;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="moscow-night"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Flash cut overlay -->
      <div id="flash"></div>

      <!-- Scene 1 · 0–3s -->
      <div
        id="host-scene1"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <!-- Scene 2 · 3–8s -->
      <div
        id="host-scene2"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="3"
        data-duration="5"
        data-track-index="1"
      ></div>

      <!-- Scene 3 · 8–15s -->
      <div
        id="host-scene3"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="8"
        data-duration="7"
        data-track-index="1"
      ></div>

      <!-- Scene 4 · 15–20s -->
      <div
        id="host-scene4"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="15"
        data-duration="5"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /*
        Root timeline orchestrates only the hard-cut flashes between scenes.
        Each scene's internal animation is handled by its own sub-composition timeline.

        Scene 1 impact flash is orchestrated here so the overlay sits above
        all sub-composition layers (z-index: 200).
      */

      // Scene 1 — impact flash after title smash (local offset 0.34s → global 0.34s)
      tl.fromTo("#flash", { autoAlpha: 0.88 }, { autoAlpha: 0, duration: 0.32, ease: "power2.out" }, 0.34);

      // Cut → Scene 2 at t=3s
      tl.fromTo("#flash", { autoAlpha: 0.55 }, { autoAlpha: 0, duration: 0.14, ease: "none" }, 3.00);

      // Scene 3 stat impact flash (local offset 0.38s → global 8.38s)
      tl.fromTo("#flash", { autoAlpha: 0.72 }, { autoAlpha: 0, duration: 0.14, ease: "none" }, 8.00);
      tl.fromTo("#flash", { autoAlpha: 0.30 }, { autoAlpha: 0, duration: 0.22, ease: "power2.out" }, 8.38);

      // Cut → Scene 4 at t=15s (hardest — climax)
      tl.fromTo("#flash", { autoAlpha: 0.88 }, { autoAlpha: 0, duration: 0.14, ease: "none" }, 15.00);

      // Scene 4 impact flash
      tl.fromTo("#flash", { autoAlpha: 0.40 }, { autoAlpha: 0, duration: 0.26, ease: "power2.out" }, 15.32);

      // Sentinel
      tl.set({}, {}, 20);

      window.__timelines["moscow-night"] = tl;
    </script>
  </body>
</html>
