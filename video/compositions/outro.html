<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #cta { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
             font-size: 64px; color: #fff; text-align: center; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="outro"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="cta" class="clip" data-start="0" data-duration="5" data-track-index="1">
        Thanks for watching
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#cta", { opacity: 0, scale: 0.8, duration: 1 }, 0);
      window.__timelines["outro"] = tl;
    </script>
  </body>
</html>
