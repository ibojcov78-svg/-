<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #title { position: absolute; top: 0; left: 0;
               font-size: 80px; font-weight: 700; color: #fff; text-align: center; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="intro"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1">
        Your Title Here
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title",
        { opacity: 0, xPercent: -50, yPercent: -50, x: 960, y: 540 },
        { opacity: 1, xPercent: -50, yPercent: -50, x: 960, y: 540, duration: 1 },
        0
      );
      window.__timelines["intro"] = tl;
    </script>
  </body>
</html>
