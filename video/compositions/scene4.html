<!-- Scene 4 · [15–20s] · Pulse finale + logo -->
<template id="scene4-template">
  <div data-composition-id="scene4" data-width="1920" data-height="1080">
    <style>
      #scene4 {
        position: absolute;
        inset: 0;
        background: #0a0a0a;
        font-family: 'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
        overflow: hidden;
      }

      #scene4 .decor {
        position: absolute;
        z-index: 1;
        pointer-events: none;
        user-select: none;
      }

      #scene4 .s4-ghost {
        font-size: 540px;
        font-weight: 900;
        color: rgba(255, 215, 0, 0.028);
        letter-spacing: -22px;
        top: -60px;
        right: -40px;
        white-space: nowrap;
        line-height: 1;
      }

      #scene4 .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 100px 160px;
        gap: 28px;
        box-sizing: border-box;
        position: relative;
        z-index: 2;
      }

      #scene4 .s4-headline {
        font-size: 148px;
        font-weight: 900;
        color: #fff;
        line-height: 0.87;
        text-transform: uppercase;
        letter-spacing: -4px;
        will-change: transform;
      }

      #scene4 .s4-rule {
        height: 3px;
        width: 0;
        background: rgba(255, 215, 0, 0.55);
      }

      #scene4 .s4-subtitle {
        font-size: 58px;
        font-weight: 400;
        color: #FFD700;
        letter-spacing: 5px;
      }

      #scene4 .logo {
        position: absolute;
        bottom: 72px;
        right: 120px;
        z-index: 3;
        font-size: 20px;
        font-weight: 900;
        color: #FFD700;
        letter-spacing: 11px;
        text-transform: uppercase;
        border: 2px solid #FFD700;
        padding: 14px 28px;
      }
    </style>

    <div class="decor s4-ghost" aria-hidden="true">КИНО</div>

    <div class="scene-content">
      <div class="s4-headline">ВСЁ КАК<br>В КИНО</div>
      <div class="s4-rule" id="s4-rule"></div>
      <div class="s4-subtitle">только платишь ты</div>
    </div>

    <div class="logo">МСК ✦</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Headline smashes from top — mirrors scene 1, closes the arc
      tl.fromTo(".s4-headline",
        { y: -290, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.24, ease: "power4.out" },
        0.14
      );

      // Heavier shake — climax deserves more
      tl.to(".s4-headline", { x: 18,  duration: 0.04 }, 0.38);
      tl.to(".s4-headline", { x: -13, duration: 0.04 }, 0.42);
      tl.to(".s4-headline", { x: 6,   duration: 0.04 }, 0.46);
      tl.to(".s4-headline", { x: 0,   duration: 0.05 }, 0.50);

      // Rule sweeps
      tl.to("#s4-rule", { width: 220, duration: 0.42, ease: "expo.out" }, 0.48);

      // Subtitle from RIGHT — directional variation, reads as a "response"
      tl.fromTo(".s4-subtitle",
        { autoAlpha: 0, x: 80 },
        { autoAlpha: 1, x: 0, duration: 0.40, ease: "expo.out" },
        0.68
      );

      // Logo elastic snap
      tl.fromTo(".logo",
        { autoAlpha: 0, scale: 0.72 },
        { autoAlpha: 1, scale: 1, duration: 0.52, ease: "back.out(1.7)" },
        1.18
      );

      // Headline heartbeat — finite 4 cycles (breathe phase)
      tl.to(".s4-headline", { scale: 1.016, duration: 0.48, repeat: 4, yoyo: true, ease: "sine.inOut" }, 2.10);

      // Sentinel
      tl.set({}, {}, 5);

      window.__timelines["scene4"] = tl;
    </script>
  </div>
</template>
